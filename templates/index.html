
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Search Console verification -->
    <meta name="google-site-verification" content="5iMg0IsWd16Ain6f7A1289I_mOG8PaDKDfBjyF7uig4" />

    <!-- Google AdSense account -->
    <meta name="google-adsense-account" content="ca-pub-6355414723132442">

    <title>Password Strength Checker</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
</head>

<body>
    <div class="container">

        <img
            src="{{ url_for('static', filename='logo.svg') }}"
            alt="Password Strength Checker logo"
            class="logo"
        >

        <h1>Password Strength Checker</h1>
        <p>Check your password strength instantly.</p>

        <form method="POST">
            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
                autocomplete="new-password"
            >

            <button type="submit">Check Strength</button>
        </form>

        {% if strength %}
            <h2>{{ strength }}</h2>
            <p>{{ feedback }}</p>
        {% endif %}

        <p class="warning">
            For your privacy, never share your password with anyone.
        </p>

    </div>
</body>
</html>
